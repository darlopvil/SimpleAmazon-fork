<!doctype html>

<html lang="en">
    <head>
        <title>SimpleAmazon</title>
        <meta name="description" contents="Simple and anonymous frontend for Amazon Search">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
    </head>


<style>
body {
    max-width: 1200px;
    margin: 10px auto;
    padding-left: 5px;
    padding-right: 5px;
    padding-bottom: 5px;
}

img {
    padding: 5px;
    width: 250px;
}


button {
    font-size: 1rem;
    padding: 4px 10px;
    border: 2px solid #888888;
}

input {
    font-size: 1rem;
    padding: 4px;
    border: 2px solid #888888;
}


a:visited {
    text-decoration: none;
}

a {
    text-decoration: none;
}

input:focus,
button:focus {
    outline: 2px solid #5d94ff;
}

@media screen and (prefers-color-scheme: dark) {
    body {
        background-color: #bce2e5;
        color: #555;
    }

    a:visited {
        color: #9759c6;
    }

    a:hover {
        color: #9759c6;
    }

    a {
        color: #6c9bd2;
    }

    button,
    input {
        background-color: #131618;
        border-color: #495057;
        color: #f8f9fa;
    }

    center {
        background-color: #fff;
        box-shadow: 0px 0px 20px rgba(0,0,0,0.1);
        padding-bottom: 5px;
    }
}

</style>

    <body>
        <center>
            <h2>SimpleAmazon</h2>
            <h5>A simple frontend for Amazon Search</h5>

            <form action="/s" method="POST">
                <input size="5" type="text" name="tld" id="tld" placeholder="com" value="com"/>
                <input size="45" style="max-width: 100%" type="text" name="k" id="k" placeholder="Amazon Search"/>
                <button type="submit">Search</button>
            </form>
        </center>
    </body>
</html>
